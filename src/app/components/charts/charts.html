<div class="chart-grid">

    <!-- Employee Growth -->
    <div class="analytics-card">

        <div class="analytics-header">

            <h2>Employee Growth</h2>

            <select>
                <option>This Year</option>
                <option>Last Year</option>
            </select>

        </div>

        <div class="chart-box">
            <canvas #employeeChart></canvas>
        </div>

    </div>

    <!-- Attendance -->
    <div class="analytics-card">

        <div class="analytics-header">

            <h2>Attendance Overview</h2>

            <select>
                <option>This Month</option>
                <option>Last Month</option>
            </select>

        </div>

        <div class="chart-box">
            <canvas #attendanceChart></canvas>
        </div>

    </div>

    <!-- Department Distribution -->
    <div class="analytics-card">

        <div class="analytics-header">

            <h2>Department Distribution</h2>

            <select>
                <option>Current</option>
            </select>

        </div>

        <div class="chart-box">
            <canvas #departmentChart></canvas>
        </div>

    </div>

    <!-- Payroll Trend -->
    <div class="analytics-card">

        <div class="analytics-header">

            <h2>Payroll Trend</h2>

            <select>
                <option>2026</option>
                <option>2025</option>
            </select>

        </div>

        <div class="chart-box">
            <canvas #payrollChart></canvas>
        </div>

    </div>

</div>
